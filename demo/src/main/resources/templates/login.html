<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Examination Portal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef6ff, #f5f7ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-container {
            width: min(420px, 90%);
            background: white;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.15);
            padding: 30px;
        }
        h2 {
            margin: 0 0 10px;
            text-align: center;
            color: #1f2937;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        label {
            font-size: 0.92rem;
            font-weight: 600;
            color: #334155;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .btn {
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            cursor: pointer;
        }
        .error {
            padding: 10px 12px;
            border-radius: 10px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 0.9rem;
            text-align: center;
        }
        .bottom-text {
            margin-top: 18px;
            text-align: center;
            color: #475569;
            font-size: 0.92rem;
        }
        .bottom-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to your examination account</p>

        <div th:if="${error}" class="error" th:text="${error}"></div>

        <form method="post" action="/login">
            <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Enter your email" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" required>
            </div>

            <button class="btn" type="submit">Login</button>
        </form>

        <p class="bottom-text">New here? <a href="/signup">Create an account</a></p>
    </div>
</body>
</html>
